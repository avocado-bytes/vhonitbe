<div class="picker">
  <div #map class="picker-map" role="application" [attr.aria-label]="'LOCATION_PICKER.MAP' | translate"></div>
  <svg class="crosshair" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
    <g fill="none" stroke-linecap="round">
      <g stroke="#fff" stroke-width="5">
        <path d="M20 2v12M20 26v12M2 20h12M26 20h12" />
        <circle cx="20" cy="20" r="3" />
      </g>
      <g stroke="#1a2e1d" stroke-width="2">
        <path d="M20 2v12M20 26v12M2 20h12M26 20h12" />
        <circle cx="20" cy="20" r="3" />
      </g>
    </g>
  </svg>
</div>
<p class="form-text mt-1 mb-2">{{ 'LOCATION_PICKER.HINT' | translate }}</p>

<div class="row g-2">
  <div class="col">
    <label for="location-picker-latitude" class="form-label small mb-1">{{ 'LOCATION_PICKER.LATITUDE' | translate }}</label>
    <input
      id="location-picker-latitude"
      class="form-control form-control-sm"
      readonly
      [value]="location().latitude | number: '1.6-6'"
    />
  </div>
  <div class="col">
    <label for="location-picker-longitude" class="form-label small mb-1">{{ 'LOCATION_PICKER.LONGITUDE' | translate }}</label>
    <input
      id="location-picker-longitude"
      class="form-control form-control-sm"
      readonly
      [value]="location().longitude | number: '1.6-6'"
    />
  </div>
</div>
