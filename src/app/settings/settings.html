<section class="container py-4">
  <h2 class="h4 mb-4">{{ 'SETTINGS.TITLE' | translate }}</h2>

  <fieldset class="mb-4">
    <legend class="form-label fs-6 fw-semibold">{{ 'SETTINGS.THEME' | translate }}</legend>
    @for (option of themes; track option) {
      <div class="form-check form-check-inline">
        <input
          class="form-check-input"
          type="radio"
          name="theme"
          [id]="'theme-' + option"
          [value]="option"
          [checked]="theme() === option"
          (change)="setTheme(option)"
        />
        <label class="form-check-label" [for]="'theme-' + option">
          {{ 'SETTINGS.THEMES.' + option | translate }}
        </label>
      </div>
    }
  </fieldset>

  <div class="mb-4 d-flex flex-column">
    <label for="language" class="form-label fw-semibold">{{ 'SETTINGS.LANGUAGE' | translate }}</label>
    <select id="language" class="form-select w-auto" #languageSelect (change)="setLanguage(languageSelect.value)">
      @for (option of languages; track option) {
        <option [value]="option" [selected]="language() === option">
          {{ 'SETTINGS.LANGUAGES.' + option | translate }}
        </option>
      }
    </select>
  </div>
</section>
